<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Image Upload & Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #090a0f;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .main-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-align: center;
        }

        /* Dynamic Glassmorphism Drop Zone */
        #drop-zone {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Fits box dynamically to image size */
            width: fit-content;
            height: fit-content;
            min-width: 320px;
            min-height: 220px;
            max-width: 80vw;
            max-height: 70vh;

            padding: 12px;
            border: 2px dashed rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            background: rgba(18, 19, 28, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                        inset 0 0 20px rgba(168, 85, 247, 0.05);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        #drop-zone:hover, #drop-zone.drag-over {
            border-color: #a855f7;
            background: rgba(28, 29, 45, 0.75);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.35), 
                        inset 0 0 25px rgba(168, 85, 247, 0.1);
            transform: scale(1.01);
        }

        /* Initial Placeholder UI */
        #placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            pointer-events: none;
            padding: 40px 30px;
            text-align: center;
        }

        #placeholder svg {
            width: 48px;
            height: 48px;
            stroke: #c084fc;
            transition: transform 0.3s ease;
        }

        #drop-zone:hover #placeholder svg {
            transform: translateY(-5px);
        }

        #placeholder p {
            font-size: 0.95rem;
            font-weight: 500;
        }

        #placeholder span {
            font-size: 0.8rem;
            color: #64748b;
        }

        /* Adaptive Preview Image */
        #preview {
            display: none;
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Overlay text shown when hovering over an already loaded image */
        .overlay-hint {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 15, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            font-weight: 500;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 18px;
            pointer-events: none;
        }

        #drop-zone.has-image:hover .overlay-hint,
        #drop-zone.has-image.drag-over .overlay-hint {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Canvas for particle background -->
    <canvas id="particle-canvas"></canvas>

    <div class="main-wrapper">
        <h1 class="title">Upload & Preview</h1>

        <div id="drop-zone">
            <!-- Hidden File Input -->
            <input type="file" id="file-input" accept="image/*" style="display: none;">

            <!-- Placeholder Content -->
            <div id="placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>
                <p>Drag & drop image here or click to browse</p>
                <span>Supports JPG, PNG, WEBP, GIF</span>
            </div>

            <!-- Image Tag -->
            <img id="preview" alt="Image Preview">

            <!-- Overlay text when replacing image -->
            <div class="overlay-hint">Drop new image or click to replace</div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. Moving Particles Background Animation
        // -------------------------------------------------------------
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2 + 1;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(168, 85, 247, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(147, 51, 234, ${0.18 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // -------------------------------------------------------------
        // 2. Drag and Drop & Adaptive Resizing Logic
        // -------------------------------------------------------------
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            const file = files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();

                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                    dropZone.classList.add('has-image');
                };

                reader.readAsDataURL(file);
            } else {
                alert("Please select or drop a valid image file.");
            }
        }
    </script>
</body>
</html>
